name: Build OpenPaper release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows build
        run: dotnet publish WallpaperClient/WallpaperClient.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o dist/OpenPaper-win-x64
      - name: Archive
        run: Compress-Archive -Path dist/OpenPaper-win-x64/* -DestinationPath dist/OpenPaper-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/OpenPaper-win-x64.zip

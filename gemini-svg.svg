<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#000000" />

  <!-- Logo Mark: 3 Overlapping Dynamic Panels Forming 'O' -->
  <g transform="translate(250, 250)">
    <!-- Top-Right Panel -->
    <path d="M -20 -140 L 90 -110 C 140 -60 150 20 110 80 L 10 -10 C 50 -50 20 -100 -20 -140 Z" 
          fill="#FFFFFF" opacity="0.95" />
    
    <!-- Bottom-Left Panel -->
    <path d="M 20 140 L -90 110 C -140 60 -150 -20 -110 -80 L -10 10 C -50 50 -20 100 20 140 Z" 
          fill="#FFFFFF" opacity="0.65" />
    
    <!-- Center-Crossing Panel (Completes the 'O' Loop) -->
    <path d="M -110 -40 L -30 -120 C 40 -150 120 -80 80 40 L -20 -20 C 20 -50 -40 -70 -110 -40 Z" 
          fill="#FFFFFF" opacity="0.35" />
  </g>
</svg>
